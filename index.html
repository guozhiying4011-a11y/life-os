<style>
  :root {
    --paper: #F7F5F0;
    --ink: #2B2B26;
    --moss: #5C7A5C;
    --moss-soft: #EAF0E9;

  }

  html, body {
    margin: 0;
    padding: 0;

    overscroll-behavior: none;
  }
  #root { height: 100%; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }

  button:focus-visible, div[tabindex]:focus-visible {
    outline: 2px solid var(--moss);
    outline-offset: 2px;
  }

</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

// ---------- storage helpers (localStorage for standalone HTML) ----------
const STORAGE_KEY = "today-state";

const todayDateStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(
    d.getDate()
  ).padStart(2, "0")}`;
};

const defaultState = () => ({
  date: todayDateStr(),
  streak: 0,
  ended: false,
  spendToday: 0,
  budgetToday: 200,
  studyMinutes: 25,
  studyGoalMinutes: 45,
});

const TODOS_KEY = "todo-items";
const ENTRIES_KEY = "ledger-entries";

const TODO_TAGS = [
  { id: "study", label: "学习", emoji: "📚" },
  { id: "work", label: "工作", emoji: "💼" },
  { id: "life", label: "生活", emoji: "🏠" },
  { id: "health", label: "健康", emoji: "🏃" },
];

const PRIORITIES = [
  { id: "low", label: "低" },
  { id: "mid", label: "中" },
  { id: "high", label: "高" },
];

const REMINDER_OPTIONS = [
  { id: "none", label: "不提醒", minutesBefore: null },
  { id: "onTime", label: "准时", minutesBefore: 0 },
  { id: "m15", label: "提前15分钟", minutesBefore: 15 },
  { id: "h1", label: "提前1小时", minutesBefore: 60 },
  { id: "d1", label: "提前1天", minutesBefore: 1440 },
];

const reminderMinutes = (id) => {
  const r = REMINDER_OPTIONS.find((o) => o.id === id);
  return r ? r.minutesBefore : null;
};

const requestNotifyPermission = () => {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
};

const fireReminder = (todo) => {
  const body = todo.dueTime ? `截止时间 ${todo.dueTime}` : "该做这件事了";
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("🌱 " + todo.title, { body, tag: todo.id });
    } catch (e) {}
  }
  if (navigator.vibrate) navigator.vibrate([15, 60, 15]);
};

const loadTodos = () => {
  try {
    const raw = localStorage.getItem(TODOS_KEY);
    return raw ? JSON.parse(raw) : defaultTodos();
  } catch (e) {
    return defaultTodos();
  }
};

const saveTodos = (todos) => {
  try {
    localStorage.setItem(TODOS_KEY, JSON.stringify(todos));
  } catch (e) {}
};

const defaultTodos = () => [
  { id: "t1", title: "完成雅思口语练习", tag: "study", priority: "mid", dueDate: todayDateStr(), done: false, createdAt: Date.now() },
  { id: "t2", title: "跑步 3 公里", tag: "health", priority: "low", dueDate: todayDateStr(), done: false, createdAt: Date.now() },
  { id: "t3", title: "回复客户邮件", tag: "work", priority: "high", dueDate: todayDateStr(), done: false, createdAt: Date.now() },
];

// tasks relevant to today: due today or earlier, and not done
// (no overdue-day labeling — items just quietly show up, per Zero Pressure)


const CATEGORIES = [
  {
    id: "food", label: "饮食", emoji: "🍜",
    subs: [
      { id: "food-daily", label: "日常饮食" },
      { id: "food-out", label: "外出饮食" },
    ],
  },
  {
    id: "transit", label: "交通", emoji: "🚌",
    subs: [
      { id: "transit-public", label: "公共交通" },
      { id: "transit-taxi", label: "打车" },
      { id: "transit-trip", label: "长途出行" },
    ],
  },
  {
    id: "shopping", label: "购物", emoji: "🛍️",
    subs: [
      { id: "shopping-daily", label: "生活用品" },
      { id: "shopping-clothes", label: "服饰" },
      { id: "shopping-other", label: "其他" },
    ],
  },
  {
    id: "living", label: "生活", emoji: "🏠",
    subs: [
      { id: "living-rent", label: "房租" },
      { id: "living-utility", label: "水电" },
      { id: "living-phone", label: "话费" },
    ],
  },
  {
    id: "fun", label: "娱乐", emoji: "🎬",
    subs: [],
  },
  {
    id: "medical", label: "医疗", emoji: "💊",
    subs: [],
  },
];

const categoryById = (id) => CATEGORIES.find((c) => c.id === id);
const subById = (cat, subId) => cat && cat.subs.find((s) => s.id === subId);

const loadState = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (parsed.date !== todayDateStr()) {
      const streak = parsed.ended ? parsed.streak + 1 : 0;
      // 跨天时，把"昨日预算 - 昨日消费"累加到可支配额度
      const yesterdayBudget = parsed.budgetToday ?? defaultState().budgetToday;
      const yesterdaySpend = parsed.spendToday ?? 0;
      const dayDelta = Math.round((yesterdayBudget - yesterdaySpend) * 100) / 100;
      const newBalance = Math.round((loadBalance() + dayDelta) * 100) / 100;
      saveBalance(newBalance);
      // 预算和学习目标沿用上一天的设置（而非重置为默认值）
      return {
        ...defaultState(),
        streak,
        budgetToday: yesterdayBudget,
        studyGoalMinutes: parsed.studyGoalMinutes ?? defaultState().studyGoalMinutes,
        spendToday: sumEntriesForDate(loadEntries(), todayDateStr()),
        studyMinutes: sumStudyMinutesForDate(loadStudySessions(), todayDateStr()),
      };
    }
    return { ...defaultState(), ...parsed, spendToday: sumEntriesForDate(loadEntries(), todayDateStr()) };
  } catch (e) {
    return defaultState();
  }
};

const saveState = (state) => {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
};

const loadEntries = () => {
  try {
    const raw = localStorage.getItem(ENTRIES_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
};

const saveEntries = (entries) => {
  try {
    localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries));
  } catch (e) {}
};

const entryDateStr = (ts) => {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

const sumEntriesForDate = (entries, dateStr) =>
  Math.round(
    entries.filter((e) => entryDateStr(e.t) === dateStr).reduce((sum, e) => sum + e.amount, 0) * 100
  ) / 100;

const HOLD_DURATION_MS = 900;
const HISTORY_KEY = "day-history";

const loadHistory = () => {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
};

const saveHistory = (history) => {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) {}
};

const STUDY_KEY = "study-sessions";

const loadStudySessions = () => {
  try {
    const raw = localStorage.getItem(STUDY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
};

const saveStudySessions = (sessions) => {
  try {
    localStorage.setItem(STUDY_KEY, JSON.stringify(sessions));
  } catch (e) {}
};

const sumStudyMinutesForDate = (sessions, dateStr) =>
  sessions.filter((s) => entryDateStr(s.t) === dateStr).reduce((sum, s) => sum + s.minutes, 0);

// 起始日期工具：返回本周一 / 本月初 / 本年初 的 YYYY-MM-DD
const startOfWeekStr = () => {
  const d = new Date();
  const day = d.getDay() || 7; // 周日=7
  const monday = new Date(d);
  monday.setDate(d.getDate() - day + 1);
  monday.setHours(0, 0, 0, 0);
  return `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, "0")}-${String(monday.getDate()).padStart(2, "0")}`;
};
const startOfMonthStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;
};
const startOfYearStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-01-01`;
};

const sumStudyMinutesSince = (sessions, dateStr) =>
  sessions.filter((s) => entryDateStr(s.t) >= dateStr).reduce((sum, s) => sum + s.minutes, 0);

const sumEntriesSince = (entries, dateStr) =>
  Math.round(
    entries.filter((e) => entryDateStr(e.t) >= dateStr).reduce((sum, e) => sum + e.amount, 0) * 100
  ) / 100;

// ---------- savings (收入/存钱) ----------
const SAVINGS_KEY = "savings-entries";
const loadSavings = () => {
  try {
    const raw = localStorage.getItem(SAVINGS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
};
const saveSavings = (savings) => {
  try {
    localStorage.setItem(SAVINGS_KEY, JSON.stringify(savings));
  } catch (e) {}
};
const sumSavingsForDate = (savings, dateStr) =>
  Math.round(
    savings.filter((e) => entryDateStr(e.t) === dateStr).reduce((sum, e) => sum + e.amount, 0) * 100
  ) / 100;
const sumSavingsSince = (savings, dateStr) =>
  Math.round(
    savings.filter((e) => entryDateStr(e.t) >= dateStr).reduce((sum, e) => sum + e.amount, 0) * 100
  ) / 100;

// ---------- budget balance (累计可支配额度) ----------
const BALANCE_KEY = "budget-balance";
const loadBalance = () => {
  try {
    const raw = localStorage.getItem(BALANCE_KEY);
    return raw ? parseFloat(raw) || 0 : 0;
  } catch (e) {
    return 0;
  }
};
const saveBalance = (bal) => {
  try {
    localStorage.setItem(BALANCE_KEY, String(bal));
  } catch (e) {}
};

// ---------- poop (一坨记事) ----------
const POOP_KEY = "poop-sessions";
const POOP_TYPES = [
  { id: "formed", label: "成形", emoji: "💪" },
  { id: "hard", label: "偏硬", emoji: "🪨" },
  { id: "soft", label: "偏软", emoji: "🫠" },
  { id: "watery", label: "水样", emoji: "💧" },
];
const poopTypeById = (id) => POOP_TYPES.find((t) => t.id === id) || null;
const loadPoopSessions = () => {
  try {
    const raw = localStorage.getItem(POOP_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
};
const savePoopSessions = (sessions) => {
  try {
    localStorage.setItem(POOP_KEY, JSON.stringify(sessions));
  } catch (e) {}
};
const countPoopForDate = (sessions, dateStr) =>
  sessions.filter((s) => entryDateStr(s.t) === dateStr).length;
const countPoopSince = (sessions, dateStr) =>
  sessions.filter((s) => entryDateStr(s.t) >= dateStr).length;

// 回算历史结余：从第一条消费记录开始，把过去每天的"预算-消费"累加到 balance
// 只执行一次，用 budget-balance-backfilled 标记
const BACKFILL_KEY = "budget-balance-backfilled";
const backfillBalance = (entries, dailyBudget) => {
  try {
    if (localStorage.getItem(BACKFILL_KEY)) return loadBalance();
    if (!entries || entries.length === 0) {
      localStorage.setItem(BACKFILL_KEY, "1");
      return loadBalance();
    }
    const today = todayDateStr();
    // 收集所有过去日期（不含今天）
    const dates = new Set();
    entries.forEach((e) => {
      const ds = entryDateStr(e.t);
      if (ds < today) dates.add(ds);
    });
    if (dates.size === 0) {
      localStorage.setItem(BACKFILL_KEY, "1");
      return loadBalance();
    }
    // 按日期汇总每天消费
    const spendByDate = {};
    entries.forEach((e) => {
      const ds = entryDateStr(e.t);
      if (ds < today) {
        spendByDate[ds] = (spendByDate[ds] || 0) + e.amount;
      }
    });
    // 累加每天的结余
    let bal = loadBalance();
    Object.keys(spendByDate).forEach((ds) => {
      const daySpend = spendByDate[ds] || 0;
      bal += dailyBudget - daySpend;
    });
    bal = Math.round(bal * 100) / 100;
    saveBalance(bal);
    localStorage.setItem(BACKFILL_KEY, "1");
    return bal;
  } catch (e) {
    return loadBalance();
  }
};

const formatHours = (minutes) => {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h === 0) return `${m}分`;
  if (m === 0) return `${h}时`;
  return `${h}时${m}分`;
};


function TodayScreen({ state, setState, todos, setTodos, onOpenTodo, onOpenStudy, onOpenLedgerStats, onOpenPoop, poopToday, onRecordDay, availableBalance }) {
  const [holdProgress, setHoldProgress] = useState(0);
  const [holding, setHolding] = useState(false);
  const [quickTodo, setQuickTodo] = useState("");

  const holdRafRef = useRef(null);
  const holdStartRef = useRef(0);

  // stable set: items relevant to today, plus anything already completed today
  // (so checking a box doesn't make it vanish from the count mid-render)
  const todayStr = todayDateStr();
  const relevantTodos = todos
    .filter((t) => t.dueDate && t.dueDate <= todayStr && (!t.done || t.completedOn === todayStr))
    .sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const pRank = { high: 0, mid: 1, low: 2 };
      const pa = pRank[a.priority] ?? 1;
      const pb = pRank[b.priority] ?? 1;
      if (pa !== pb) return pa - pb;
      return (a.dueDate || "") < (b.dueDate || "") ? -1 : 1;
    });

  const toggleTask = useCallback((id) => {
    setTodos((prev) =>
      prev.map((t) =>
        t.id === id
          ? { ...t, done: !t.done, completedOn: !t.done ? todayDateStr() : null }
          : t
      )
    );
  }, [setTodos]);

  const addQuickTodo = useCallback(() => {
    const title = quickTodo.trim();
    if (!title) return;
    setTodos((prev) => [
      ...prev,
      {
        id: "todo" + Date.now(),
        title,
        tag: null,
        priority: "mid",
        dueDate: todayDateStr(),
        dueTime: null,
        reminder: "none",
        notified: false,
        done: false,
        completedOn: null,
        createdAt: Date.now(),
      },
    ]);
    setQuickTodo("");
    if (navigator.vibrate) navigator.vibrate(10);
  }, [quickTodo, setTodos]);

  const doneCount = relevantTodos.filter((t) => t.done).length;
  const totalCount = relevantTodos.length;
  const completion = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;
  const studyPct = Math.min(100, Math.round((state.studyMinutes / state.studyGoalMinutes) * 100));
  const budgetLeft = state.budgetToday - state.spendToday;
  const growth = Math.round(completion * 0.5 + studyPct * 0.3 + (budgetLeft >= 0 ? 20 : 8));

  const endToday = useCallback(() => {
    setState((s) => ({ ...s, ended: true, streak: s.streak + 1 }));
    if (onRecordDay) {
      onRecordDay({
        date: todayDateStr(),
        growth,
        completion,
        doneCount,
        totalCount,
      });
    }
  }, [setState, onRecordDay, growth, completion, doneCount, totalCount]);

  const restartToday = useCallback(() => {
    setState((s) => ({ ...s, ended: false }));
  }, [setState]);

  // ---- long-press handlers ----
  const stopHold = useCallback((completed) => {
    if (holdRafRef.current) cancelAnimationFrame(holdRafRef.current);
    holdRafRef.current = null;
    setHolding(false);
    if (!completed) setHoldProgress(0);
  }, []);

  const tickHold = useCallback(() => {
    const elapsed = Date.now() - holdStartRef.current;
    const pct = Math.min(1, elapsed / HOLD_DURATION_MS);
    setHoldProgress(pct);
    if (pct >= 1) {
      stopHold(true);
      endToday();
      setHoldProgress(0);
      if (navigator.vibrate) navigator.vibrate(15);
      return;
    }
    holdRafRef.current = requestAnimationFrame(tickHold);
  }, [endToday, stopHold]);

  const startHold = useCallback(
    (e) => {
      e.preventDefault();
      holdStartRef.current = Date.now();
      setHolding(true);
      holdRafRef.current = requestAnimationFrame(tickHold);
    },
    [tickHold]
  );

  const cancelHold = useCallback(() => {
    stopHold(false);
  }, [stopHold]);

  const reflection = growthReflection(growth, completion, state.ended);
  const dateLabel = formatDateLabel();

  return (
    <div className="page">
      <div className="container">
        <div className="header">
          <span className="eyebrow">{dateLabel}</span>
          {state.streak > 0 && <span className="streak">连续 {state.streak} 天</span>}
        </div>

        <div className="growth-block">
          <GrowthPlant growth={growth} />
          <div className="growth-reflection">{reflection}</div>
        </div>

        {!state.ended ? (
          <div className="scrollless">
            <Section title="今日消费" compact>
              <div className="card-compact card-tappable" onClick={onOpenLedgerStats}>
                <div className="row-between-compact">
                  <span className="spend-amount">¥{state.spendToday}</span>
                  <span
                    className="card-value-muted"
                    style={{ color: budgetLeft >= 0 ? "var(--muted)" : "var(--clay)" }}
                  >
                    {budgetLeft >= 0 ? `预算剩 ¥${budgetLeft} ›` : `超出预算 ¥${Math.abs(budgetLeft)} ›`}
                  </span>
                </div>
                <div className="bar-track-tight">
                  <div
                    className="bar-fill"
                    style={{
                      width: `${Math.min(100, Math.round((state.spendToday / state.budgetToday) * 100))}%`,
                      background: budgetLeft >= 0 ? "var(--moss)" : "var(--clay)",
                    }}
                  />
                </div>
                <div className="balance-row">
                  <span className="balance-label">可支配额度</span>
                  <span className="balance-value" style={{ color: availableBalance >= 0 ? "var(--moss)" : "var(--clay)" }}>
                    {availableBalance >= 0 ? "¥" + formatBalance(availableBalance) : "-¥" + formatBalance(Math.abs(availableBalance))}
                  </span>
                </div>
              </div>
            </Section>

            <Section title="今日学习" compact>
              <div className="card-compact card-tappable" onClick={onOpenStudy}>
                <div className="row-between-compact">
                  <span className="card-label">
                    {state.studyMinutes} / {state.studyGoalMinutes} 分钟
                  </span>
                  <span className="card-value-muted">{studyPct}% ›</span>
                </div>
                <div className="bar-track-tight">
                  <div className="bar-fill" style={{ width: `${studyPct}%` }} />
                </div>
              </div>
            </Section>

            <Section title="今日一坨" compact>
              <div className="card-compact card-tappable" onClick={onOpenPoop}>
                <div className="row-between-compact">
                  <span className="card-label">🚽 一坨记事</span>
                  <span className="card-value-muted">
                    {poopToday > 0 ? `今日 ${poopToday} 次 ›` : "记录 ›"}
                  </span>
                </div>
              </div>
            </Section>

            <Section title="今日重点" sub={`${doneCount}/${totalCount} 完成`} compact grow onSubClick={onOpenTodo}>
              <div className="card-tasks">
                {relevantTodos.length === 0 ? (
                  <div className="ledger-empty">今天没有安排任务</div>
                ) : (
                  relevantTodos.map((t, i) => {
                    const tagInfo = TODO_TAGS.find((g) => g.id === t.tag);
                    return (
                      <div
                        key={t.id}
                        className="task-row"
                        style={{ borderTop: i === 0 ? "none" : "1px solid var(--line)" }}
                        onClick={() => toggleTask(t.id)}
                      >
                        <span className={"checkbox" + (t.done ? " checkbox-done" : "")}>
                          {t.done ? "✓" : ""}
                        </span>
                        <span className={"task-title" + (t.done ? " task-title-done" : "")}>
                          {t.title}
                        </span>
                        {tagInfo && (
                          <span className="task-tag">{tagInfo.emoji} {tagInfo.label}</span>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
              <div className="quick-todo-row">
                <input
                  className="quick-todo-input"
                  placeholder="添加任务，回车确认"
                  value={quickTodo}
                  onChange={(e) => setQuickTodo(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addQuickTodo()}
                  maxLength={60}
                />
                <button
                  className={"quick-todo-add" + (quickTodo.trim() ? "" : " quick-todo-add-disabled")}
                  onClick={addQuickTodo}
                  disabled={!quickTodo.trim()}
                  aria-label="添加任务"
                >
                  +
                </button>
              </div>
            </Section>

            <button
              className="end-button"
              onPointerDown={startHold}
              onPointerUp={cancelHold}
              onPointerLeave={cancelHold}
              onPointerCancel={cancelHold}
              onContextMenu={(e) => e.preventDefault()}
            >
              <span
                className="end-button-fill"
                style={{ width: `${holdProgress * 100}%` }}
              />
              <span className="end-button-label">
                {holding ? "长按结束中…" : "长按结束今天"}
              </span>
            </button>
          </div>
        ) : (
          <EndedSummary
            state={state}
            doneCount={doneCount}
            totalCount={totalCount}
            completion={completion}
            studyPct={studyPct}
            budgetLeft={budgetLeft}
            onRestart={restartToday}
          />
        )}
      </div>
    </div>
  );
}

function Section({ title, sub, children, grow, onSubClick }) {
  return (
    <div className={grow ? "section section-grow" : "section"}>
      <div className="section-header">
        <span className="section-title">{title}</span>
        {sub && (
          <span

            onClick={onSubClick}
          >
            {sub}{onSubClick ? " ›" : ""}
          </span>
        )}
      </div>
      {children}
    </div>
  );
}

function StatsView({ entries, savings }) {
  const [range, setRange] = useState("week"); // week | month | year
  const [expanded, setExpanded] = useState(null);
  const [viewMode, setViewMode] = useState("pie"); // pie | list

  const { filtered, rangeLabel } = filterEntriesByRange(entries, range);
  const total = Math.round(filtered.reduce((s, e) => s + e.amount, 0) * 100) / 100;
  const { filtered: filteredSavings } = filterEntriesByRange(savings || [], range);
  const totalIncome = Math.round(filteredSavings.reduce((s, e) => s + e.amount, 0) * 100) / 100;
  const savedMoney = Math.round((totalIncome - total) * 100) / 100; // 扣掉消费后剩余

  const byCategory = CATEGORIES.map((c) => {
    const catEntries = filtered.filter((e) => e.category === c.id);
    const sum = catEntries.reduce((s, e) => s + e.amount, 0);

    const subGroups = c.subs
      .map((s) => {
        const subSum = catEntries
          .filter((e) => e.subCategory === s.id)
          .reduce((acc, e) => acc + e.amount, 0);
        return { ...s, sum: Math.round(subSum * 100) / 100 };
      })
      .filter((s) => s.sum > 0)
      .sort((a, b) => b.sum - a.sum);

    const unlabeledSum = catEntries
      .filter((e) => !e.subCategory)
      .reduce((acc, e) => acc + e.amount, 0);
    if (unlabeledSum > 0) {
      subGroups.push({ id: c.id + "-none", label: "未分类", sum: Math.round(unlabeledSum * 100) / 100 });
    }

    return { ...c, sum: Math.round(sum * 100) / 100, subGroups };
  })
    .filter((c) => c.sum > 0)
    .sort((a, b) => b.sum - a.sum);

  return (
    <div className="scrollless">
      <div className="range-tabs">
        {[
          { id: "week", label: "本周" },
          { id: "month", label: "本月" },
          { id: "year", label: "本年" },
        ].map((r) => (
          <button
            key={r.id}
            className={"range-tab" + (range === r.id ? " range-tab-active" : "")}
            onClick={() => {
              setRange(r.id);
              setExpanded(null);
            }}
          >
            {r.label}
          </button>
        ))}
      </div>

      <div className="stats-total-block">
        <div className="stats-total-row">
          <div>
            <div className="stats-total">¥{formatMoney(total)}</div>
            <div className="stats-total-label">{rangeLabel}消费 · 共 {filtered.length} 笔</div>
            <div className="stats-saving-compare">
              <span>消费 ¥{formatMoney(total)}</span>
              <span className="stats-saving-dot">·</span>
              <span style={{ color: "var(--moss)" }}>收入 ¥{formatMoney(totalIncome)}</span>
              <span className="stats-saving-dot">·</span>
              <span style={{ color: savedMoney >= 0 ? "var(--moss)" : "var(--clay)" }}>存钱 ¥{formatMoney(savedMoney)}</span>
            </div>
          </div>
          <div className="view-toggle">
            <button
              className={"view-toggle-btn" + (viewMode === "pie" ? " view-toggle-btn-active" : "")}
              onClick={() => setViewMode("pie")}
              aria-label="饼图"
            >
              ◔
            </button>
            <button
              className={"view-toggle-btn" + (viewMode === "list" ? " view-toggle-btn-active" : "")}
              onClick={() => setViewMode("list")}
              aria-label="列表"
            >
              ☰
            </button>
          </div>
        </div>
      </div>

      <div className="stats-list-wrap">
        {byCategory.length === 0 ? (
          <div className="ledger-empty">这段时间还没有记录</div>
        ) : (
          <>
            {viewMode === "pie" && (
              <div className="pie-wrap">
                <PieChart data={byCategory} total={total} />
              </div>
            )}
            <div className="card-tasks stats-card-tasks">
              {byCategory.map((c, i) => {
                const pct = total > 0 ? Math.round((c.sum / total) * 100) : 0;
                const isOpen = expanded === c.id;
                const hasSubs = c.subGroups.length > 0;
                return (
                  <div
                    key={c.id}
                    className="stats-row"
                    style={{ borderTop: i === 0 ? "none" : "1px solid var(--line)" }}
                  >
                    <div
                      className={"stats-row-top" + (hasSubs ? " stats-row-clickable" : "")}
                      onClick={() => hasSubs && setExpanded(isOpen ? null : c.id)}
                    >
                      <span className="stats-row-label">
                        {viewMode === "pie" && (
                          <span className="stats-dot" style={{ background: categoryColor(c.id) }} />
                        )}
                        <span className="category-emoji">{c.emoji}</span> {c.label}
                        {hasSubs && <span className={"stats-caret" + (isOpen ? " stats-caret-open" : "")}>›</span>}
                      </span>
                      <span className="stats-row-value">¥{formatMoney(c.sum)} · {pct}%</span>
                    </div>
                    {viewMode === "list" && (
                      <div className="bar-track-tight">
                        <div className="bar-fill" style={{ width: `${pct}%` }} />
                      </div>

                    {isOpen && (
                      <div className="stats-sub-list">
                        {c.subGroups.map((s) => {
                          const subPct = c.sum > 0 ? Math.round((s.sum / c.sum) * 100) : 0;
                          return (
                            <div key={s.id} className="stats-sub-row">
                              <span className="stats-sub-label">{s.label}</span>
                              <span className="stats-sub-value">¥{formatMoney(s.sum)} · {subPct}%</span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

const CATEGORY_COLORS = {
  food: "#5C7A5C",
  transit: "#8FA88F",
  shopping: "#B5876B",
  living: "#C9A87C",
  fun: "#9B8AA0",
  medical: "#A0787A",
};
function categoryColor(id) {
  return CATEGORY_COLORS[id] || "#B7B2A3";
}

function PieChart({ data, total }) {
  const size = 168;
  const r = 66;
  const cx = size / 2;
  const cy = size / 2;
  let cursor = -90; // start at 12 o'clock

  const slices = data.map((c) => {
    const pct = total > 0 ? c.sum / total : 0;
    const angle = pct * 360;
    const start = cursor;
    const end = cursor + angle;
    cursor = end;
    return { ...c, start, end, pct };
  });

  const polar = (angleDeg, radius) => {
    const rad = (angleDeg * Math.PI) / 180;
    return [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
  };

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {slices.map((s) => {
        if (s.pct <= 0) return null;
        if (s.pct >= 0.999) {
          return <circle key={s.id} cx={cx} cy={cy} r={r} fill={categoryColor(s.id)} />;
        }
        const [x1, y1] = polar(s.start, r);
        const [x2, y2] = polar(s.end, r);
        const largeArc = s.end - s.start > 180 ? 1 : 0;
        const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
        return <path key={s.id} d={d} fill={categoryColor(s.id)} />;
      })}
      <circle cx={cx} cy={cy} r={r * 0.55} fill="var(--paper)" />
      <text x={cx} y={cy - 3} textAnchor="middle" fontSize="15" fontFamily="Georgia, 'Songti SC', serif" fill="var(--ink)">
        ¥{formatMoney(total)}
      </text>
      <text x={cx} y={cy + 14} textAnchor="middle" fontSize="9.5" fill="var(--muted)">
        总支出
      </text>
    </svg>
  );
}

function formatMoney(n) {
  const v = Math.round(n * 100) / 100;
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, "");
}

// 余额始终保留两位小数
const formatBalance = (n) => (Math.round(n * 100) / 100).toFixed(2);

// 日期前后移动一天，返回 YYYY-MM-DD
const shiftDate = (dateStr, deltaDays) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + deltaDays);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

// 明细日期导航的展示文案：今日 / 昨天 / M月D日 周X
const dateNavLabel = (dateStr) => {
  const today = todayDateStr();
  if (dateStr === today) return "今日";
  if (dateStr === shiftDate(today, -1)) return "昨天";
  const d = new Date(dateStr + "T00:00:00");
  const weekday = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
  return `${d.getMonth() + 1}月${d.getDate()}日 ${weekday}`;
};

function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0 = Sunday
  const diff = day === 0 ? 6 : day - 1; // Monday as start
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() - diff);
  return date;
}

function filterEntriesByRange(entries, range) {
  const now = new Date();
  let start, rangeLabel;
  if (range === "week") {
    start = startOfWeek(now);
    rangeLabel = "本周";
  } else if (range === "month") {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    rangeLabel = "本月";
  } else {
    start = new Date(now.getFullYear(), 0, 1);
    rangeLabel = "本年";
  }
  const startMs = start.getTime();
  return { filtered: entries.filter((e) => e.t >= startMs), rangeLabel };
}

function formatTime(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function dueDatePreset(daysFromToday) {
  const d = new Date();
  d.setDate(d.getDate() + daysFromToday);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function dueDateLabel(dueDate, dueTime) {
  if (!dueDate) return "";
  const today = todayDateStr();
  const tomorrow = dueDatePreset(1);
  let label;
  if (dueDate === today) label = "今天";
  else if (dueDate === tomorrow) label = "明天";
  else if (dueDate < today) label = "已过期";
  else {
    const [y, m, d] = dueDate.split("-");
    label = `${parseInt(m)}月${parseInt(d)}日`;
  }
  return dueTime ? `${label} ${dueTime}` : label;
}

function StudyScreen({ sessions, setSessions, studyGoalMinutes }) {
  const [running, setRunning] = useState(false);
  const [elapsedSec, setElapsedSec] = useState(0);
  const [manualMinutes, setManualMinutes] = useState("");
  const [showManual, setShowManual] = useState(false);
  const tickRef = useRef(null);
  const startRef = useRef(0);

  const todayStr = todayDateStr();
  const todayMinutes = sumStudyMinutesForDate(sessions, todayStr);
  const todaySessions = sessions
    .filter((s) => entryDateStr(s.t) === todayStr)
    .sort((a, b) => b.t - a.t);
  const goalPct = Math.min(100, Math.round((todayMinutes / studyGoalMinutes) * 100));

  const weekMinutes = sumStudyMinutesSince(sessions, startOfWeekStr());
  const monthMinutes = sumStudyMinutesSince(sessions, startOfMonthStr());
  const yearMinutes = sumStudyMinutesSince(sessions, startOfYearStr());

  useEffect(() => {
    if (running) {
      startRef.current = Date.now() - elapsedSec * 1000;
      tickRef.current = setInterval(() => {
        setElapsedSec(Math.floor((Date.now() - startRef.current) / 1000));
      }, 1000);
    }
    return () => clearInterval(tickRef.current);
    // eslint-disable-next-line
  }, [running]);

  const toggleRun = () => {
    if (running) {
      // pause: bank whatever whole minutes were completed
      const mins = Math.floor(elapsedSec / 60);
      if (mins > 0) {
        setSessions((prev) => [...prev, { id: "s" + Date.now(), minutes: mins, t: Date.now() }]);
      }
      setElapsedSec(0);
      setRunning(false);
    } else {
      setRunning(true);
    }
  };

  const addManual = () => {
    const v = parseInt(manualMinutes, 10);
    if (!isNaN(v) && v > 0) {
      setSessions((prev) => [...prev, { id: "s" + Date.now(), minutes: v, t: Date.now() }]);
      setManualMinutes("");
      setShowManual(false);
      if (navigator.vibrate) navigator.vibrate(10);
    }
  };

  const mm = String(Math.floor(elapsedSec / 60)).padStart(2, "0");
  const ss = String(elapsedSec % 60).padStart(2, "0");

  return (
    <div className="page">
      <div className="container">
        <div className="header">
          <span className="eyebrow">今日学习</span>
          <span className="streak">{todayMinutes} / {studyGoalMinutes} 分钟</span>
        </div>

        <div className="study-tree-block">
          <StudyTree seconds={elapsedSec} running={running} />
          <div className="study-timer">{mm}:{ss}</div>
          <div className="study-timer-hint">
            {running ? "专注中，随时可以停下" : "开始一段专注时间"}
          </div>
        </div>

        <button className={"study-run-button" + (running ? " study-run-button-active" : "")} onClick={toggleRun}>
          {running ? "结束这段" : "开始专注"}
        </button>

        <div className="bar-track-tight" style={{ margin: "16px 0 4px" }}>
          <div className="bar-fill" style={{ width: `${goalPct}%` }} />
        </div>

        <div className="study-stat-strip">
          <div className="study-stat-cell">
            <div className="study-stat-value">{formatHours(weekMinutes)}</div>
            <div className="study-stat-label">本周</div>
          </div>
          <div className="study-stat-divider" />
          <div className="study-stat-cell">
            <div className="study-stat-value">{formatHours(monthMinutes)}</div>
            <div className="study-stat-label">本月</div>
          </div>
          <div className="study-stat-divider" />
          <div className="study-stat-cell">
            <div className="study-stat-value">{formatHours(yearMinutes)}</div>
            <div className="study-stat-label">本年</div>
          </div>
        </div>

        <div className="scrollless" style={{ marginTop: 8 }}>
          <Section title="今日记录" sub={`${todaySessions.length} 段`} grow>
            <div className="card-tasks">
              {todaySessions.length === 0 ? (
                <div className="ledger-empty">今天还没有学习记录</div>
              ) : (
                todaySessions.map((s, i) => (
                  <div
                    key={s.id}
                    className="ledger-row"
                    style={{ borderTop: i === 0 ? "none" : "1px solid var(--line)" }}
                  >
                    <span className="ledger-emoji">📚</span>
                    <span className="ledger-label">专注 {s.minutes} 分钟</span>
                    <span className="ledger-time">{formatTime(s.t)}</span>
                  </div>
                ))
              )}
            </div>
          </Section>

          {!showManual ? (
            <button className="add-entry-button" onClick={() => setShowManual(true)}>
              + 手动添加学习时长
            </button>
          ) : (
            <div className="manual-study-row">
              <input
                className="me-setting-input manual-study-input"
                inputMode="numeric"
                placeholder="分钟数"
                autoFocus
                value={manualMinutes}
                onChange={(e) => setManualMinutes(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addManual()}
              />
              <button className="ledger-cancel" onClick={() => { setShowManual(false); setManualMinutes(""); }}>取消</button>
              <button className="ledger-save" onClick={addManual}>添加</button>
            </div>

    </div>
  );
}

// A small tree that grows with focused seconds in the current session,
// inspired by Forest's core idea — but nothing here ever withers or dies;
// stopping just banks the minutes already earned (Zero Pressure).
function StudyTree({ seconds, running }) {
  const stage = Math.min(5, Math.floor(seconds / 60)); // grows every minute, caps at 5
  const trunkH = 14 + stage * 7;
  const canopyR = 10 + stage * 4;
  const baseY = 96;
  const topY = baseY - trunkH;

  return (
    <div className="study-tree-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120" style={{ overflow: "visible" }}>
        <ellipse cx="60" cy={baseY + 3} rx="22" ry="4" fill="var(--line)" opacity="0.6" />
        <rect x="57" y={topY} width="6" height={trunkH} rx="3" fill="#8a6f52" />
        <circle
          cx="60"
          cy={topY - canopyR * 0.6}
          r={canopyR}
          fill="var(--moss)"
          opacity={running ? 0.95 : 0.75}
        />
        {stage >= 2 && (
          <circle cx="48" cy={topY - canopyR * 0.3} r={canopyR * 0.65} fill="var(--moss)" opacity={running ? 0.85 : 0.65} />
        )}
        {stage >= 3 && (
          <circle cx="72" cy={topY - canopyR * 0.3} r={canopyR * 0.65} fill="var(--moss)" opacity={running ? 0.85 : 0.65} />
        )}
      </svg>
    </div>
  );
}

function GrowthPlant({ growth }) {
  const stage = growth >= 85 ? 4 : growth >= 65 ? 3 : growth >= 35 ? 2 : growth >= 10 ? 1 : 0;
  const stemHeight = 8 + stage * 11;
  const leafPairs = Math.min(3, stage);
  const showBloom = stage === 4;
  const baseY = 92;
  const topY = baseY - stemHeight;

  const leaves = [];
  for (let i = 0; i < leafPairs; i++) {
    const t = (i + 1) / (leafPairs + (showBloom ? 0.4 : 0.7));
    const y = baseY - stemHeight * t;
    const size = 9 + i * 1.5;
    leaves.push(
      <g key={"l-" + i}>
        <path
          d={`M 50 ${y} C ${50 - size - 4} ${y - 3}, ${50 - size - 4} ${y - size}, 50 ${y - 2}`}
          fill="var(--moss)"
          opacity={0.85 - i * 0.08}
        />
        <path
          d={`M 50 ${y} C ${50 + size + 4} ${y - 3}, ${50 + size + 4} ${y - size}, 50 ${y - 2}`}
          fill="var(--moss)"
          opacity={0.85 - i * 0.08}
        />
      </g>
    );
  }

  return (
    <div className="plant-wrap" aria-label={`成长阶段 ${stage}`}>
      <svg width="100" height="100" viewBox="0 0 100 100" style={{ overflow: "visible" }}>
        <line x1="30" y1={baseY} x2="70" y2={baseY} stroke="var(--line)" strokeWidth="2" strokeLinecap="round" />
        {stemHeight > 0 && (
          <path
            d={`M 50 ${baseY} Q ${50 + (stage % 2 === 0 ? 3 : -3)} ${(baseY + topY) / 2}, 50 ${topY}`}
            fill="none"
            stroke="var(--moss)"
            strokeWidth="2.5"
            strokeLinecap="round"
          />
        )}
        {stage === 0 && <circle cx="50" cy={baseY - 4} r="3" fill="var(--moss)" opacity="0.7" />}
        {leaves}
        {showBloom && (
          <g>
            <circle cx="50" cy={topY - 2} r="5" fill="var(--clay)" opacity="0.9" />
            <circle cx="44" cy={topY + 1} r="3.5" fill="var(--clay)" opacity="0.7" />
            <circle cx="56" cy={topY + 1} r="3.5" fill="var(--clay)" opacity="0.7" />
          </g>
        )}
      </svg>
    </div>
  );
}

function growthReflection(growth, completion, ended) {
  if (ended) return "今天已经结束了，休息一下。";
  if (completion === 0) return "今天才刚开始，慢慢来。";
  if (growth >= 85) return "长得很好，继续保持。";
  if (growth >= 65) return "在稳稳地生长。";
  if (growth >= 35) return "新的叶子冒出来了。";
  return "种子已经种下。";
}

function formatDateLabel() {
  const d = new Date();
  const weekday = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
  return `${d.getMonth() + 1}月${d.getDate()}日 · ${weekday}`;
}

function MeScreen({ state, setState, history, setHistory, entries, setEntries, todos, setTodos, studySessions, setStudySessions, savings, setSavings, poopSessions, setPoopSessions, availableBalance, budgetBalance, setBudgetBalance, onResetAll }) {
  const [budgetInput, setBudgetInput] = useState(String(state.budgetToday));
  const [studyGoalInput, setStudyGoalInput] = useState(String(state.studyGoalMinutes));
  const [confirmingReset, setConfirmingReset] = useState(false);
  const [exportDone, setExportDone] = useState(false);
  const [importDone, setImportDone] = useState(false);
  const [importError, setImportError] = useState("");
  const fileInputRef = useRef(null);

  useEffect(() => {
    setBudgetInput(String(state.budgetToday));
  }, [state.budgetToday]);

  useEffect(() => {
    setStudyGoalInput(String(state.studyGoalMinutes));
  }, [state.studyGoalMinutes]);

  const totalDays = history.length;
  const totalGrowth = history.reduce((sum, h) => sum + (h.growth || 0), 0);
  const longestStreak = computeLongestStreak(history);
  const totalStudyMinutes = (studySessions || []).reduce((sum, s) => sum + s.minutes, 0);
  const totalSpend = (entries || []).reduce((sum, e) => sum + e.amount, 0);
  const totalSpendRounded = Math.round(totalSpend * 100) / 100;
  const totalIncome = (savings || []).reduce((sum, e) => sum + e.amount, 0);
  const totalSavings = totalIncome - totalSpend;
  const totalSavingsRounded = Math.round(totalSavings * 100) / 100;
  const companionLine = meCompanionLine(totalDays);

  const commitBudget = () => {
    const v = parseFloat(budgetInput);
    if (!isNaN(v) && v > 0) {
      setState((s) => ({ ...s, budgetToday: Math.round(v * 100) / 100 }));
    } else {
      setBudgetInput(String(state.budgetToday));
    }
  };

  const commitStudyGoal = () => {
    const v = parseInt(studyGoalInput, 10);
    if (!isNaN(v) && v > 0) {
      setState((s) => ({ ...s, studyGoalMinutes: v }));
    } else {
      setStudyGoalInput(String(state.studyGoalMinutes));
    }
  };

  const exportData = () => {
    const payload = {
      exportedAt: new Date().toISOString(),
      state,
      entries,
      todos,
      history,
      studySessions,
      savings,
      poopSessions,
      budgetBalance,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `life-os-backup-${todayDateStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setExportDone(true);
    setTimeout(() => setExportDone(false), 2000);
  };

  const importData = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportError("");
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed.state && typeof parsed.state === "object") {
          setState({ ...defaultState(), ...parsed.state });
        }
        if (Array.isArray(parsed.entries)) setEntries(parsed.entries);
        if (Array.isArray(parsed.todos)) setTodos(parsed.todos);
        if (Array.isArray(parsed.history)) setHistory(parsed.history);
        if (Array.isArray(parsed.studySessions)) setStudySessions(parsed.studySessions);
        if (Array.isArray(parsed.savings)) setSavings(parsed.savings);
        if (Array.isArray(parsed.poopSessions)) setPoopSessions(parsed.poopSessions);
        if (typeof parsed.budgetBalance === "number") {
          setBudgetBalance(parsed.budgetBalance);
          saveBalance(parsed.budgetBalance);
        } else {
          // 旧备份没有 budgetBalance，重新回算
          localStorage.removeItem(BACKFILL_KEY);
          const bal = backfillBalance(parsed.entries || [], (parsed.state?.budgetToday) ?? defaultState().budgetToday);
          setBudgetBalance(bal);
        }
        setImportDone(true);
        setTimeout(() => setImportDone(false), 2500);
      } catch (err) {
        setImportError("文件格式错误");
        setTimeout(() => setImportError(""), 3000);
      }
      // reset so same file can be picked again
      if (fileInputRef.current) fileInputRef.current.value = "";
    };
    reader.onerror = () => {
      setImportError("读取失败");
      setTimeout(() => setImportError(""), 3000);
    };
    reader.readAsText(file);
  };

  const triggerImport = () => {
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleReset = () => {
    if (!confirmingReset) {
      setConfirmingReset(true);
      return;
    }
    onResetAll();
    setConfirmingReset(false);
  };

  return (
    <div className="page">
      <div className="container me-container">
        <div className="me-scroll">
          <div className="me-hero">
            <div className="me-hero-texture" />
            <div className="me-hero-avatar">
              <GrowthPlant growth={Math.min(100, 40 + totalDays * 2)} />
            </div>
            <div className="me-hero-name">Gniy</div>
            <div className="me-hero-line">{companionLine}</div>
            <div className="me-hero-stats">
              <div className="me-hero-stat">
                <div className="me-hero-stat-value">{totalDays}</div>
                <div className="me-hero-stat-label">总完成</div>
              </div>
              <div className="me-hero-stat">
                <div className="me-hero-stat-value">{longestStreak}</div>
                <div className="me-hero-stat-label">最长连续</div>
              </div>
              <div className="me-hero-stat">
                <div className="me-hero-stat-value">{totalGrowth}</div>
                <div className="me-hero-stat-label">成长值</div>
              </div>
            </div>
          </div>

          <div className="me-stat-strip">
            <div className="me-stat-cell">
              <div className="me-stat-value">{formatHours(totalStudyMinutes)}</div>
              <div className="me-stat-label">总学习时长</div>
            </div>
            <div className="me-stat-divider" />
            <div className="me-stat-cell">
              <div className="me-stat-value">¥{totalSpendRounded}</div>
              <div className="me-stat-label">累计消费</div>
            </div>
            <div className="me-stat-divider" />
            <div className="me-stat-cell">
              <div className="me-stat-value" style={{ color: totalSavingsRounded >= 0 ? "var(--moss)" : "var(--clay)" }}>¥{totalSavingsRounded}</div>
              <div className="me-stat-label">累计存钱</div>
            </div>
            <div className="me-stat-divider" />
            <div className="me-stat-cell">
              <div className="me-stat-value" style={{ color: availableBalance >= 0 ? "var(--moss)" : "var(--clay)" }}>
                {availableBalance >= 0 ? "¥" + formatBalance(availableBalance) : "-¥" + formatBalance(Math.abs(availableBalance))}
              </div>
              <div className="me-stat-label">可支配额度</div>
            </div>
          </div>

          <div className="me-list-label">日常设置</div>
          <div className="me-list-card">
            <div className="me-list-row">
              <span className="me-list-row-label">💰 每日预算</span>
              <div className="me-list-row-input-wrap">
                <span className="me-setting-prefix">¥</span>
                <input
                  className="me-list-input"
                  inputMode="decimal"
                  value={budgetInput}
                  onChange={(e) => setBudgetInput(e.target.value)}
                  onBlur={commitBudget}
                  onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
                />
              </div>
            </div>
            <div className="me-list-row" style={{ borderTop: "1px solid var(--line)" }}>
              <span className="me-list-row-label">📚 每日学习目标</span>
              <div className="me-list-row-input-wrap">
                <input
                  className="me-list-input"
                  inputMode="numeric"
                  value={studyGoalInput}
                  onChange={(e) => setStudyGoalInput(e.target.value)}
                  onBlur={commitStudyGoal}
                  onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
                />
                <span className="me-setting-suffix">分钟</span>
              </div>
            </div>
          </div>

          <div className="me-list-label">数据</div>
          <div className="me-list-card">
            <div className="me-list-row me-list-row-action" onClick={exportData}>
              <span className="me-list-row-label">⬇️ 导出数据</span>
              <span className="me-list-row-chevron">{exportDone ? "已导出 ✓" : "›"}</span>
            </div>
            <div
              className="me-list-row me-list-row-action"
              style={{ borderTop: "1px solid var(--line)" }}
              onClick={triggerImport}
            >
              <span className="me-list-row-label">⬆️ 导入数据</span>
              <span className="me-list-row-chevron">
                {importError ? importError : importDone ? "已导入 ✓" : "›"}
              </span>
            </div>
            <input
              ref={fileInputRef}
              type="file"
              accept="application/json,.json"
              style={{ display: "none" }}
              onChange={importData}
            />
            <div
              className="me-list-row me-list-row-action"
              style={{ borderTop: "1px solid var(--line)" }}
              onClick={handleReset}
            >
              <span className={"me-list-row-label" + (confirmingReset ? " me-list-row-danger" : "")}>
                🗑️ {confirmingReset ? "再次点击确认清空" : "清空重新开始"}
              </span>
              {!confirmingReset && <span className="me-list-row-chevron">›</span>}
            </div>
          </div>
          {confirmingReset && (
            <button className="me-data-button-cancel" onClick={() => setConfirmingReset(false)}>
              取消
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function meCompanionLine(totalDays) {
  if (totalDays === 0) return "刚刚开始，慢慢来。";
  if (totalDays < 7) return `已经陪伴了 ${totalDays} 天`;
  if (totalDays < 30) return `一起走过 ${totalDays} 天了`;
  return `${totalDays} 天的成长，一直都在`;
}

function computeLongestStreak(history) {
  if (history.length === 0) return 0;
  const dates = [...new Set(history.map((h) => h.date))].sort();
  let longest = 1;
  let current = 1;
  for (let i = 1; i < dates.length; i++) {
    const prev = new Date(dates[i - 1]);
    const cur = new Date(dates[i]);
    const diffDays = Math.round((cur - prev) / 86400000);
    if (diffDays === 1) {
      current += 1;
      longest = Math.max(longest, current);
    } else {
      current = 1;
    }
  }
  return longest;
}

        <span className="nav-label">Me</span>

  );
}

function App() {
  const [state, setState] = useState(null);
  const [entries, setEntries] = useState([]);
  const [todos, setTodos] = useState([]);
  const [history, setHistory] = useState([]);
  const [studySessions, setStudySessions] = useState([]);
  const [savings, setSavings] = useState([]);
  const [budgetBalance, setBudgetBalance] = useState(0);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("today");
  const [jumpToAddLedger, setJumpToAddLedger] = useState(false);
  const [jumpToStatsLedger, setJumpToStatsLedger] = useState(false);
  const [jumpToAddTodo, setJumpToAddTodo] = useState(false);
  const [poopSessions, setPoopSessions] = useState([]);

  useEffect(() => {
    const loadedState = loadState();
    setState(loadedState);
    const loadedEntries = loadEntries();
    setEntries(loadedEntries);
    setTodos(loadTodos());
    setHistory(loadHistory());
    setStudySessions(loadStudySessions());
    setSavings(loadSavings());
    setPoopSessions(loadPoopSessions());
    // 回算历史结余（只执行一次），用当前预算作为每日预算
    const dailyBudget = loadedState?.budgetToday ?? defaultState().budgetToday;
    const backfilledBalance = backfillBalance(loadedEntries, dailyBudget);
    setBudgetBalance(backfilledBalance);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!state) return;
    saveState(state);
  }, [state]);

  useEffect(() => {
    saveEntries(entries);
    // keep today's spend in sync with the entry log (single source of truth)
    setState((s) => (s ? { ...s, spendToday: sumEntriesForDate(entries, todayDateStr()) } : s));
  }, [entries]);

  useEffect(() => {
    if (!loading) saveTodos(todos);
  }, [todos]);

  useEffect(() => {
    if (!loading) saveHistory(history);
  }, [history]);

  useEffect(() => {
    saveStudySessions(studySessions);
    setState((s) => (s ? { ...s, studyMinutes: sumStudyMinutesForDate(studySessions, todayDateStr()) } : s));
  }, [studySessions]);

  useEffect(() => {
    saveSavings(savings);
  }, [savings]);

  useEffect(() => {
    savePoopSessions(poopSessions);
  }, [poopSessions]);

  // 实时可支配额度 = 累计结余 + (今日预算 - 今日消费)
  const availableBalance = state
    ? Math.round((budgetBalance + (state.budgetToday - state.spendToday)) * 100) / 100
    : 0;

  const recordDay = useCallback((snapshot) => {
    setHistory((prev) => {
      const withoutToday = prev.filter((h) => h.date !== snapshot.date);
      return [...withoutToday, snapshot];
    });
  }, []);

  const resetAllData = useCallback(() => {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(ENTRIES_KEY);
    localStorage.removeItem(TODOS_KEY);
    localStorage.removeItem(HISTORY_KEY);
    localStorage.removeItem(STUDY_KEY);
    localStorage.removeItem(SAVINGS_KEY);
    localStorage.removeItem(BALANCE_KEY);
    localStorage.removeItem(BACKFILL_KEY);
    localStorage.removeItem(POOP_KEY);
    setState(defaultState());
    setEntries([]);
    setTodos(defaultTodos());
    setHistory([]);
    setStudySessions([]);
    setSavings([]);
    setPoopSessions([]);
    setBudgetBalance(0);
  }, []);

  // ---- reminder polling ----
  // Note: this only fires while the page/tab is open (no service worker / push
  // server here), so it's a best-effort in-app + OS-notification reminder,
  // not a guaranteed background alarm.
  useEffect(() => {
    const check = () => {
      const now = Date.now();
      setTodos((prev) => {
        let changed = false;
        const next = prev.map((t) => {
          if (t.done || t.notified || !t.dueDate || !t.dueTime) return t;
          const minsBefore = reminderMinutes(t.reminder);
          if (minsBefore === null) return t;
          const dueMs = new Date(`${t.dueDate}T${t.dueTime}:00`).getTime();
          const fireMs = dueMs - minsBefore * 60000;
          if (now >= fireMs) {
            fireReminder(t);
            changed = true;
            return { ...t, notified: true };
          }
          return t;
        });
        return changed ? next : prev;
      });
    };
    const timer = setInterval(check, 20000);
    check();
    return () => clearInterval(timer);
  }, []);

  if (loading || !state) {
    return (
      <div className="page-center">
        <div className="loading-dot" />
      </div>
    );
  }

  return (
    <div className="app-shell">
      {tab === "today" && (
        <TodayScreen
          state={state}
          setState={setState}
          todos={todos}
          setTodos={setTodos}
          onOpenTodo={() => setTab("todo")}
          onOpenStudy={() => setTab("study")}
          onOpenLedgerStats={() => {
            setTab("ledger");
            setJumpToStatsLedger(true);
          }}
          onOpenPoop={() => setTab("poop")}
          poopToday={countPoopForDate(poopSessions, todayDateStr())}
          onRecordDay={recordDay}
          availableBalance={availableBalance}
        />
      )}
      {tab === "ledger" && (
        <LedgerScreen
          entries={entries}
          setEntries={setEntries}
          savings={savings}
          setSavings={setSavings}
          spendToday={state.spendToday}
          budgetToday={state.budgetToday}
          availableBalance={availableBalance}
          jumpToAdd={jumpToAddLedger}
          jumpToStats={jumpToStatsLedger}
          onConsumeJump={() => setJumpToAddLedger(false)}
          onConsumeStatsJump={() => setJumpToStatsLedger(false)}
        />
      )}
      {tab === "todo" && (
        <TodoScreen
          todos={todos}
          setTodos={setTodos}
          jumpToAdd={jumpToAddTodo}
          onConsumeJump={() => setJumpToAddTodo(false)}
        />
      )}
      {tab === "study" && (
        <StudyScreen
          sessions={studySessions}
          setSessions={setStudySessions}
          studyGoalMinutes={state.studyGoalMinutes}
        />
      )}
      {tab === "poop" && (
        <PoopScreen
          sessions={poopSessions}
          setSessions={setPoopSessions}
        />
      )}
      {tab === "me" && (
        <MeScreen
          state={state}
          setState={setState}
          history={history}
          setHistory={setHistory}
          entries={entries}
          setEntries={setEntries}
          todos={todos}
          setTodos={setTodos}
          studySessions={studySessions}
          setStudySessions={setStudySessions}
          savings={savings}
          setSavings={setSavings}
          poopSessions={poopSessions}
          setPoopSessions={setPoopSessions}
          availableBalance={availableBalance}
          budgetBalance={budgetBalance}
          setBudgetBalance={setBudgetBalance}
          onResetAll={resetAllData}
        />
      )}
      <BottomNav tab={tab} onChange={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
